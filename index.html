<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Mela - Kings Events Ticket</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .ticket {
      width: 100%;
      max-width: 420px;
      background: #1b1b1b;
      border: 2px solid #d4af37;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 5px;
    }

    .event {
      margin-bottom: 25px;
      font-weight: bold;
    }

    .photo {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    .label {
      color: #aaa;
      font-size: 14px;
      margin-top: 15px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
    }

    .valid {
      color: #35d07f;
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="ticket">

    <h1>KINGS EVENTS</h1>
    <div class="event">ISTANBUL IS BACK</div>

    <img
      class="photo"
      src="https://azjzfjghovlljbrtmvyp.supabase.co/storage/v1/object/public/ticket-photos/b29a8a8b-787e-4c95-9234-4a3a7c7cecd5.jpeg"
      alt="Anna Mela"
    >

    <div class="label">Name</div>
    <div class="value">Anna Mela</div>

    <div class="label">Ticket</div>
    <div class="value">General Admission</div>

    <div class="label">Price</div>
    <div class="value">$50</div>

    <div class="label">Ticket ID</div>
    <div class="value">KE-2026-0001</div>

    <div class="label">Status</div>
    <div class="valid">VALID</div>

  </div>

</body>
</html>
